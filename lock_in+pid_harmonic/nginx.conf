# Do not cache index.html: after an App upgrade the browser must load the new UI
# (an old cached index.html sends oversized POSTs that hang on Ecosystem 2.0).
location ~ ^/lock_in\+pid_harmonic/(index\.html)?$ {
    add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
    expires off;
}



location /lock_in+pid_harmonic/get_ip {
    default_type plain/text;
    add_header Content-Type "text/html";
    content_by_lua '
        ngx.say(ngx.var.remote_addr )
    ';
}


location /lock_in+pid_harmonic/lock {
    default_type plain/text;
    add_header Content-Type "text/html";

    content_by_lua '
        local data = ngx.req.get_uri_args()

        local newline = string.char(10)..string.char(13)
        local cmd = "/opt/redpitaya/www/apps/lock_in+pid_harmonic/c/lock"
        -- v2.3.10: "?name" without "=" gives vv == true (read the register; the
        -- concatenation of a boolean was a Lua error -> 500). Only register names
        -- and integers are passed to the shell.
        for kk,vv in pairs(data) do
            if type(vv) == "table" then vv = vv[#vv] end
            if string.match(kk, "^[%w_]+$") then
                if vv == true or vv == "" then
                    cmd  =  cmd .." ".. kk
                elseif string.match(tostring(vv), "^%-?%d+$") then
                    cmd  =  cmd .." ".. kk .. " " .. vv
                end
            end
        end
        -- ngx.say( cmd )

        local file   = io.popen( cmd )
        local output = file:read("*all")

        -- This will get a table with some return stuff
        -- rc[1] will be true, false or nil
        -- rc[3] will be the signal
        local rc = {file:close()}

        ngx.print( output )
    ';
}



