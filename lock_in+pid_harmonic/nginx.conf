location /lock_in+pid_harmonic/calib {
    default_type plain/text;
    add_header Content-Type "text/html";

    content_by_lua '
        local file   = io.popen( "/opt/redpitaya/bin/calib -rv" )
        local output = file:read("*all")
        local rc = {file:close()}
        ngx.print( output )
    ';
}


location /lock_in+pid_harmonic/streaming {
    default_type plain/text;
    add_header Content-Type "text/html";
    content_by_lua '
        io.popen("/opt/redpitaya/www/apps/lock_in+pid_harmonic/c/streaming", "r")
        ngx.say("OK")
    ';
}

location /lock_in+pid_harmonic/check_streaming {
    default_type plain/text;
    add_header Content-Type "text/html";
    content_by_lua '
        local rta = os.execute("/bin/pidof /opt/redpitaya/www/apps/lock_in+pid_harmonic/c/streaming");
        ngx.say(rta)
    ';
}


location /lock_in+pid_harmonic/restart_server {
    default_type plain/text;
    add_header Content-Type "text/html";
    content_by_lua '
        os.execute("systemctl restart redpitaya_nginx");
        ngx.log(ngx.STDERR, "restart_server");
        ngx.say("see you soon")
    ';
}

location /lock_in+pid_harmonic/reload_fpga {
    default_type plain/text;
    add_header Content-Type "text/html";
    content_by_lua '
        -- Examples of files:
        -- /opt/redpitaya/www/apps/lock_in+pid_harmonic/red_pitaya.bit
        -- /opt/redpitaya/fpga/fpga.bit
        -- The script output (and its exit code, as a last line "exit=N") is returned to the client.
        -- On Ecosystem 2.0 load_bit.sh does not touch the FPGA and exits with 2 -> HTTP 501.
        local file   = io.popen("/bin/bash /opt/redpitaya/www/apps/lock_in+pid_harmonic/c/load_bit.sh /opt/redpitaya/www/apps/lock_in+pid_harmonic/red_pitaya.bit 2>&1 ; echo exit=$?")
        local output = file:read("*all")
        file:close()
        local code   = tonumber(string.match(output, "exit=(%d+)")) or -1
        ngx.log(ngx.STDERR, "reload_fpga: " .. output)
        if code == 2 then
            ngx.status = 501
        elseif code ~= 0 then
            ngx.status = 500
        end
        ngx.print(output)
    ';
}
